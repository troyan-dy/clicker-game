<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>look-dev: башни с капсулами</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1f1e1d;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1920" height="1080"></canvas>
    <script>
      // Look-dev of the last screen: dark towers studded with red capsules, lightning between them, a queue of
      // people in bathrobes at the foot. Everything but the sprites is drawn by code: the same routine goes into
      // the game and grows with the purchases. ?stage=1 — the first capsule close up, ?stage=3 — the field of towers.
      const stage = Number(new URLSearchParams(location.search).get('stage') ?? 3);
      const c = document.getElementById('c');
      const g = c.getContext('2d');
      const BG = '#1f1e1d';
      const BODY = '#2a2927';
      const EDGE = 'rgba(240,238,230,0.6)';
      const DIM = 'rgba(240,238,230,0.2)';
      const POD = '#e0603c';
      const CORE = '#f6b58c';
      const BOLT = '#cfe0f4';
      let seed = 11;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      const img = (name) =>
        new Promise((ok) => {
          const i = new Image();
          i.onload = () => ok(i);
          i.src = `../../public/assets/img/nodes/${name}.webp`;
        });

      /** a capsule: a bud with a pointed top; `on` — somebody sleeps in it; big ones show the sleeper */
      function pod(x, y, s, on, squeeze = 1) {
        const w = 5.6 * s * squeeze;
        g.beginPath();
        g.moveTo(x, y - 10 * s);
        g.bezierCurveTo(x + w, y - 4 * s, x + w * 0.92, y + 5 * s, x, y + 8 * s);
        g.bezierCurveTo(x - w * 0.92, y + 5 * s, x - w, y - 4 * s, x, y - 10 * s);
        if (!on) {
          g.strokeStyle = DIM;
          g.lineWidth = 1;
          g.stroke();
          return;
        }
        g.fillStyle = POD;
        g.fill();
        if (s > 2.5) {
          g.strokeStyle = EDGE;
          g.lineWidth = 1.5;
          g.stroke();
          // the sleeper: a head and shoulders in the warm light
          g.fillStyle = CORE;
          g.beginPath();
          g.ellipse(x, y + 1.5 * s, 3 * s, 4.6 * s, 0, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = '#262624';
          g.beginPath();
          g.arc(x, y - 1.6 * s, 1.5 * s, 0, Math.PI * 2);
          g.fill();
          g.beginPath();
          g.ellipse(x, y + 3.2 * s, 2.3 * s, 2.6 * s, 0, Math.PI, 0);
          g.fill();
        } else {
          g.fillStyle = CORE;
          g.beginPath();
          g.ellipse(x, y + 0.6 * s, 1.6 * s * squeeze, 3 * s, 0, 0, Math.PI * 2);
          g.fill();
        }
      }

      /** a tower: a dark column that narrows to the top, rings of capsules on its front, cables at the foot */
      function tower(x, base, rx, h, rings, filled, s = 1, ghost = false) {
        const top = rx * 0.72;
        const ry = rx * 0.28;
        const at = (r) => rx + (top - rx) * (r / rings);
        g.beginPath();
        g.moveTo(x - rx, base);
        g.lineTo(x - top, base - h);
        g.ellipse(x, base - h, top, top * 0.28, 0, Math.PI, 0);
        g.lineTo(x + rx, base);
        g.ellipse(x, base, rx, ry, 0, 0, Math.PI);
        if (ghost) {
          g.setLineDash([6, 6]);
          g.strokeStyle = DIM;
          g.lineWidth = 1.5;
          g.stroke();
          g.setLineDash([]);
          return;
        }
        g.fillStyle = BODY;
        g.fill();
        g.strokeStyle = EDGE;
        g.lineWidth = 1.5;
        g.stroke();
        g.beginPath();
        g.ellipse(x, base - h, top, top * 0.28, 0, 0, Math.PI * 2);
        g.fillStyle = '#35332f';
        g.fill();
        g.stroke();
        // the mast the lightning strikes
        g.beginPath();
        g.moveTo(x, base - h);
        g.lineTo(x, base - h - 52 * s);
        g.stroke();
        // cables at the foot
        g.strokeStyle = DIM;
        g.lineWidth = 2;
        for (let i = -2; i <= 2; i++) {
          g.beginPath();
          g.moveTo(x + i * rx * 0.3, base + ry * 0.9);
          g.quadraticCurveTo(x + i * rx * 0.5, base + ry + 26 * s, x + i * rx * 0.75, base + ry + 30 * s);
          g.stroke();
        }
        const gap = h / (rings + 0.4);
        const slots = [];
        for (let r = 0; r < rings; r++) {
          const w = at(r + 0.5);
          const cy = base - gap * (r + 0.55);
          const count = Math.floor((w * 2.9) / (11 * s));
          for (let i = 0; i < count; i++) {
            const a = 0.1 + ((Math.PI - 0.2) * (i + 0.5)) / count;
            slots.push([x + Math.cos(a) * w * 0.985, cy + Math.sin(a) * w * 0.28, 0.5 + 0.5 * Math.sin(a)]);
          }
        }
        const lit = Math.round(slots.length * filled);
        slots.forEach(([px, py, k], i) => pod(px, py, s, i < lit, 0.45 + 0.55 * k));
      }

      function bolt(x0, y0, x1, y1) {
        g.strokeStyle = BOLT;
        g.lineWidth = 1.6;
        g.beginPath();
        g.moveTo(x0, y0);
        const steps = 8;
        let bx = 0;
        let by = 0;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const x = x0 + (x1 - x0) * t + (i < steps ? (rnd() - 0.5) * 40 : 0);
          const y = y0 + (y1 - y0) * t - Math.sin(Math.PI * t) * 40 + (i < steps ? (rnd() - 0.5) * 30 : 0);
          g.lineTo(x, y);
          if (i === 3) [bx, by] = [x, y];
        }
        g.stroke();
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(bx + 18 + rnd() * 24, by + 30 + rnd() * 20);
        g.lineTo(bx + 8 + rnd() * 30, by + 64 + rnd() * 26);
        g.stroke();
      }

      async function draw() {
        const [s1, s2, s3, drone, net] = await Promise.all(['sleeper1', 'sleeper2', 'sleeper3', 'drone', 'netcore'].map(img));
        const people = [s1, s2, s3];
        g.fillStyle = BG;
        g.fillRect(0, 0, 1920, 1080);
        g.fillStyle = 'rgba(240,238,230,0.06)';
        for (let y = 16; y < 1080; y += 32) for (let x = 16; x < 1340; x += 32) g.fillRect(x, y, 2, 2);
        const put = (im, x, y, h, flip = false) => {
          const w = (im.width * h) / im.height;
          g.save();
          g.translate(x, y);
          if (flip) g.scale(-1, 1);
          g.drawImage(im, -w / 2, -h, w, h);
          g.restore();
        };
        if (stage === 1) {
          // the beginning: one capsule, one volunteer, the outline of what will stand here
          tower(820, 1000, 330, 1500, 6, 0, 2.6, true);
          pod(820, 640, 13, true);
          g.strokeStyle = DIM;
          g.lineWidth = 3;
          g.beginPath();
          g.moveTo(820, 745);
          g.bezierCurveTo(820, 820, 700, 830, 640, 900);
          g.stroke();
          put(s1, 420, 930, 210);
          put(s2, 250, 940, 200);
          put(s3, 110, 950, 200);
          put(drone, 1010, 560, 120, true);
        } else {
          g.globalAlpha = 0.4;
          tower(170, 560, 62, 330, 9, 1, 0.5);
          tower(1190, 540, 66, 350, 10, 1, 0.5);
          g.globalAlpha = 0.62;
          tower(390, 720, 96, 470, 11, 1, 0.72);
          tower(1010, 700, 92, 440, 10, 0.75, 0.72);
          g.globalAlpha = 1;
          bolt(170, 230 - 26, 390, 250 - 38);
          bolt(1010, 260 - 38, 1190, 190 - 26);
          tower(700, 900, 150, 640, 14, 0.66, 1.05);
          bolt(390, 250 - 38, 700, 260 - 55);
          bolt(700, 260 - 55, 1010, 260 - 38);
          // the queue at the foot and those who have slept their shift, going the other way
          for (let i = 0; i < 14; i++) put(people[i % 3], 60 + i * 34, 1012 - (i % 2) * 5, 72);
          for (let i = 0; i < 5; i++) put(people[(i + 1) % 3], 930 + i * 70, 1010 - (i % 2) * 6, 72);
          put(drone, 560, 540, 58);
          put(drone, 842, 690, 58, true);
          put(drone, 760, 380, 52);
          put(net, 1190, 990, 190);
        }
        g.strokeStyle = '#3d3a36';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(1340, 0);
        g.lineTo(1340, 1080);
        g.stroke();
        document.title = 'ready';
      }
      draw();
    </script>
  </body>
</html>
